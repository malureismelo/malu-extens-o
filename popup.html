<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primeira Extensao da Malu</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h3>Primeira Extensao da Malu</h3>

    <label for="days">Projetos publicados ate (dias)</label>
    <input id="days" type="number" min="0" value="2">

    <label class="toggle-row" for="autoMode">
      <span>Modo automatico</span>
      <span class="toggle-control">
        <input id="autoMode" type="checkbox">
        <span class="toggle-slider"></span>
      </span>
    </label>
    <p class="hint">Envia sem confirmacao e sem alertas do fluxo.</p>

    <label class="toggle-row" for="repeatCycleEnabled">
      <span>Repetir a cada 10 min</span>
      <span class="toggle-control">
        <input id="repeatCycleEnabled" type="checkbox">
        <span class="toggle-slider"></span>
      </span>
    </label>
    <p class="hint">Quando o ciclo terminar, pausa 10 minutos e recomeca automaticamente.</p>

    <button id="start">Ligar</button>
    <button id="stop">Desligar</button>
    <button id="openSettings">Configuracoes</button>

    <p id="status">Parado</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
